name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/magical-feynman-utsyju]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp *.html *.webmanifest sw.js _site/
          cp -r css js icons _site/
          # Stops Pages running the files through Jekyll.
          touch _site/.nojekyll

      # Pages must already be switched on for the repository, with its source
      # set to GitHub Actions. The workflow token is not allowed to create the
      # Pages site itself, so that first step is done by hand in Settings.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
